<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #f3f3f3; --pill: #e6e6e6; --field: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
    --hover: #e2e2e2; --ring: #2b6cff; --accent: #2b6cff; --agent: #0f7b3f; --agent-bg: #dcf3e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1c; --pill: #2c2c2c; --field: #2a2a2a; --text: #ececec; --muted: #9a9a9a;
      --hover: #333333; --ring: #6e9bff; --accent: #6e9bff; --agent: #7ee2a8; --agent-bg: #173a27;
    }
  }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
               font:12px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select:none; }
  #bar { position:relative; display:flex; align-items:center; gap:6px; height:40px; box-sizing:border-box; padding-left:8px; }
  .nav { width:28px; height:28px; border:none; border-radius:8px; background:transparent; padding:0;
         display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .nav:hover { background:var(--hover); color:var(--text); }
  .nav:focus-visible, .cap:focus-visible { outline:2px solid var(--ring); outline-offset:-2px; }
  #title { max-width:220px; padding:3px 10px; border-radius:999px; background:var(--pill);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #field { flex:1; min-width:60px; position:relative; display:flex; align-items:center; height:28px;
           border-radius:999px; background:var(--field); box-shadow:inset 0 0 0 1px rgba(128,128,128,.18); }
  #field:focus-within { box-shadow:inset 0 0 0 2px var(--ring); }
  #lock { width:14px; margin-left:10px; color:var(--muted); display:none; }
  #lock.on { display:block; }
  #url { flex:1; min-width:0; height:100%; border:none; background:transparent; padding:0 12px 0 8px;
         font:13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color:var(--text); outline:none; }
  #agent { display:none; padding:3px 8px; border-radius:999px; background:var(--agent-bg); color:var(--agent);
           font-weight:600; white-space:nowrap; }
  #agent.on { display:block; }
  .cap { width:46px; height:40px; border:none; background:transparent; padding:0;
         display:flex; align-items:center; justify-content:center; color:var(--text); }
  .cap:hover { background:var(--hover); }
  #close:hover { background:#e81123; color:#fff; }
  svg { stroke:currentColor; fill:none; }
  #progress { position:absolute; left:0; bottom:0; height:2px; width:0; background:var(--accent); opacity:0;
              transition:width 2.5s cubic-bezier(.1,.7,.2,1), opacity .3s; }
  #progress.on { width:85%; opacity:1; }
  #progress.done { width:100%; opacity:0; transition:width .2s, opacity .4s .2s; }
  @media (prefers-reduced-motion: reduce) { #progress, #progress.on, #progress.done { transition:none; } }
</style>
</head>
<body>
<div id="bar">
  <button class="nav" id="back" title="Back (Alt+Left)" aria-label="Back"><svg width="14" height="14" viewBox="0 0 16 16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>
  <button class="nav" id="forward" title="Forward (Alt+Right)" aria-label="Forward"><svg width="14" height="14" viewBox="0 0 16 16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
  <button class="nav" id="reload" title="Reload (F5)" aria-label="Reload"><svg width="14" height="14" viewBox="0 0 16 16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/></svg></button>
  <span id="title">Mini</span>
  <div id="field">
    <svg id="lock" width="14" height="14" viewBox="0 0 16 16" stroke-width="1.5" aria-label="Secure connection"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
    <input id="url" spellcheck="false" autocomplete="off" aria-label="Address" placeholder="Search or enter address">
  </div>
  <span id="agent" title="CDP is open for agents (mini --move / --observe)">Agent</span>
  <button class="cap" id="btn-min" title="Minimize" aria-label="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5H10"/></svg></button>
  <button class="cap" id="btn-max" title="Maximize" aria-label="Maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9"/></svg></button>
  <button class="cap" id="close" title="Close" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0L10 10 M10 0L0 10"/></svg></button>
  <div id="progress"></div>
</div>
<script>
  const post = (msg) => window.ipc.postMessage(JSON.stringify(msg));
  const $ = (id) => document.getElementById(id);
  const url = $('url');
  let committed = '';
  url.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') post({ cmd: 'navigate', text: url.value });
    if (e.key === 'Escape') { url.value = committed; url.select(); }
  });
  url.addEventListener('focus', () => url.select());
  window.setTitle = (t) => { $('title').textContent = t; $('title').title = t; };
  window.setUrl = (u) => {
    committed = u;
    if (document.activeElement !== url) url.value = u;
    $('lock').classList.toggle('on', u.startsWith('https://'));
  };
  window.focusUrl = () => { url.focus(); url.select(); };
  window.setAgent = (port) => { const a = $('agent'); a.classList.add('on'); a.title = 'CDP open on 127.0.0.1:' + port + ' (mini --move / --observe)'; };
  window.setLoading = (on) => {
    const p = $('progress');
    if (on) { p.className = ''; void p.offsetWidth; p.className = 'on'; }
    else if (p.classList.contains('on')) p.className = 'done';
  };
  for (const [id, cmd] of [['btn-min','minimize'], ['btn-max','maximize'], ['close','close'], ['back','back'], ['forward','forward'], ['reload','reload']])
    $(id).addEventListener('click', () => post({ cmd }));
  document.body.addEventListener('mousedown', (e) => {
    if (e.target.closest('#field, button')) return;
    if (e.button === 0) post({ cmd: 'drag' });
  });
  document.body.addEventListener('dblclick', (e) => {
    if (!e.target.closest('#field, button')) post({ cmd: 'maximize' });
  });
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === 'l') { e.preventDefault(); focusUrl(); }
  });
</script>
</body>
</html>
