<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Mini</title>
<style>
  :root { --bg:#ffffff; --text:#111; --muted:#8a8a8a; --border:#dedede; --focus:#2b6cff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --text:#ececec; --muted:#7c7c7c; --border:#343434; --focus:#6e9bff; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font-family:"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  .mark { width:44px; height:44px; border-radius:13px; background:var(--text); }
  input { width:min(560px, 82vw); height:44px; box-sizing:border-box; border:1px solid var(--border); border-radius:999px;
          padding:0 20px; font-size:15px; color:var(--text); background:transparent; outline:none; text-align:center;
          transition:border-color .15s, box-shadow .15s; }
  input::placeholder { color:var(--muted); }
  input:focus { border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  .hint { color:var(--muted); font-size:12px; }
  kbd { font:inherit; padding:1px 6px; border:1px solid var(--border); border-radius:5px; }
</style>
</head>
<body>
<div class="mark" aria-hidden="true"></div>
<input id="q" placeholder="Enter URL or search…" spellcheck="false" autocomplete="off" autofocus aria-label="Enter URL or search">
<div class="hint"><kbd>Ctrl</kbd> <kbd>L</kbd> address · <kbd>Alt</kbd> <kbd>Home</kbd> start page</div>
<script>
  document.getElementById('q').addEventListener('keydown', (e) => {
    if (e.key === 'Enter')
      window.ipc.postMessage(JSON.stringify({ cmd: 'navigate', text: e.target.value }));
  });
</script>
</body>
</html>
