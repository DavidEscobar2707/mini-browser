[package]
name = "mini"
edition = "2021"

[dependencies]
wry = "0.56"
tao = { version = "0.37", features = ["rwh_06"] }
dirs = "6"
dpi = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading"] }
ureq = { version = "3", features = ["json"] }
parking_lot = "0.12"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[build-dependencies]
winresource = "0.1"
